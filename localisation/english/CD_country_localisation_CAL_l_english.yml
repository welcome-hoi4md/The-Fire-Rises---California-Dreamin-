 #Events
 cd_cal.1.t: "Battle of San Jose"
 cd_cal.1.d: "Gene Carlson looked down at the city of San Jose from the roof of an apartment complex, where he had been on high alert for any sign of activity from the communist rebels to their south since the day before. It was now around 2:00 AM, and Carlson could barely hold his eyes open. The streets of San Jose had long gone quiet, since the American government had almost entirely collapsed the month before. Had it been any other year, it shouldve been full of life. There should have been people and cars moving around, even this early in the morning, but this was not any other year. The state government told Carlsons battalion that they had consolidated in the eastern half of the state, and San Jose was too far away to be rescued in these conditions. The self proclaimed Peoples Liberation Army had blocked off anything from entering the city, and only the disgusting military rations that not a soul would dare to eat was left for the National Guard there. “All units, wake the fuck up!” The voice of Carlsons officer crackled from the radio next to him. “Listen here, the governor sent out an ultimatum to those commie bastards. If they do not stand down by 0300 hours, you are to open fire on any enemy you can find.” Carlson sighed, did the governor really think the insurgents would step down? “Copy that.” He responded, mustering up the little energy he had to answer. Carlson looked at his watch, 2:24 AM, it said. That meant he had around 30 more minutes until the ultimatum expired. Carlson drifted off to sleep, as the image of his childhood home filled his mind. He could see it on the other side of a field he was in, his late mother sitting on the porch, as she always had been. The sound of drums rumbled through the sky around his home, and as he walked towards the house, the drums got louder and louder, until he could not hear anything else. "PRIVATE CARLSON, WHERE THE FUCK ARE YOU?!" He was jolted awake, and brought back to his rooftop, only the drums had not stopped. He realized it was not drums he was hearing, but artillery. He frantically checked his watch, which now said 3:04 AM. He had overslept, and the PLA was shelling San Jose! He heard another artillery cannon fire from the south, but before he could even look in its direction, his roof was struck by a shell. Everything became a blur, as he was knocked off of his roof, down to the streets below. As he fell, the only thing he could see was that same home he had lived in as a child, his mother still waiting on the porch there for him."
 cd_cal.1.a: "Gene Carlson, the first death of many in California."