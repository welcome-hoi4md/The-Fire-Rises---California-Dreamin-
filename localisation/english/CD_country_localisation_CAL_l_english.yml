 cd_cal.1.t: "Battle of San Jose"
 cd_cal.1.d: "Gene Carlson looked down at the city of San Jose from the roof of an apartment complex, where he had been on high alert for any sign of activity from the communist rebels to their south since the day before. It was now around 2: AM, and Carlson could barely hold his eyes open. The streets of San Jose had long gone quiet, since the American government had almost entirely collapsed the month before. Had it been any other year, it shouldve been full of life. There should have been people and cars moving around, even this early in the morning, but this was not any other year. The state government told Carlsons battalion that they had consolidated in the eastern half of the state, and San Jose was too far away to be rescued in these conditions. The self proclaimed Peoples Liberation Army had blocked off anything from entering the city, and only the disgusting military rations that not a soul would dare to eat was left for the National Guard there. “All units, wake the fuck up!” The voice of Carlsons officer crackled from the radio next to him. “Listen here, the governor sent out an ultimatum to those commie bastards. If they do not stand down by 3 hours, you are to open fire on any enemy you can find.” Carlson sighed, did the governor really think the insurgents would step down? “Copy that.” He responded, mustering up the little energy he had to answer. Carlson looked at his watch, 2:24 AM, it said. That meant he had around 3 more minutes until the ultimatum expired. Carlson drifted off to sleep, as the image of his childhood home filled his mind. He could see it on the other side of a field he was in, his late mother sitting on the porch, as she always had been. The sound of drums rumbled through the sky around his home, and as he walked towards the house, the drums got louder and louder, until he could not hear anything else. "PRIVATE CARLSON, WHERE THE FUCK ARE YOU?!" He was jolted awake, and brought back to his rooftop, only the drums had not stopped. He realized it was not drums he was hearing, but artillery. He frantically checked his watch, which now said 3:4 AM. He had overslept, and the PLA was shelling San Jose! He heard another artillery cannon fire from the south, but before he could even look in its direction, his roof was struck by a shell. Everything became a blur, as he was knocked off of his roof, down to the streets below. As he fell, the only thing he could see was that same home he had lived in as a child, his mother still waiting on the porch there for him."
 cd_cal.1.a: "Gene Carlson, the first death of many in California."
 cd_cal.2.t: "An Update to the Curriculum"
 cd_cal.2.d: ""This is the map of California, and this is our neighbor, the United States!" the female teacher said with an oddly fake, joyful tone. "Now class, what makes us, California, different to the United States?" The class thought to themselves for a moment, before students started raising their hands with clear confidence. "Yes Adam?" Adam asked; "Is it that we have cooler views of the ocean?" the class laughed for a bit, Adam wasn't really known as the brightest of bulbs. The teacher responded "Now, you aren't wrong there Adam! But something more important, more government based." the class primarily looked in confusion, but, one hand stood up, ready for action. \n\n "Yes Clark?" Clark then asked "Is it cause we're leaving the United States? My dad was arguing about it to my Mom..." the previously cheerful atmosphere of the class seemed to fade away, the teacher spoke to break the silence, "You are right! We are seceding from the United States, so we will become a new nation, and we always will be!" The class took a moment to accept this new fact about the place they lived in, then a student raised his hand, and asked, "But that wasn't in the curriculum last year? Isn't that only recently-" The teacher interrupts him, saying sternly, "It's in the curriculum now, and it will be from here on!" The class falls into silence, none of the students wanting to challenge the teacher like the previous student had, until the teacher moved the class on again, "Anyways! The natural features of the nation of California are...""
 cd_cal.2.a: "School is for losers anyways."
 cd_cal.3.t: "The Declaration"
 cd_cal.3.d: "It's a warm, yet peaceful night, the TV is turned on by the family in the room, they tune into Nightly News and sit down to relax, before their favorite shows come on after this report. "Welcome to Nightly News' 10 o'clock broadcast! The Governor of California has declared that the State of California will be declaring independence from the United States of America. This means our resources, water, electricity will be provided by our current industries. Our Governor has said, and I quote: "This is for our own people, for our stability, for our peace, and for our freedom! We need to free ourselves from the chaos and the downsides of such chaos in the United States" More updates may be provided in the near future on this, so stay tun-" The TV is turned off abruptly by the Dad, his son, says with confusion "Dad why did you turn the TV off?" the Dad stares at his son and tells him "Go to your room." the son then replies "It's fine I can stay here-" the Dad interrupts him and says; "I wasn't asking." \n\n After the son leaves to his room, the Dad stares at the blank screen. After a moment of tense silence, his wife says, "Ryan, what exactly is the issue? Isn't it good for us now? We can rely on ourselves, and escape the war in the rest of the-" Ryan interrupts, with an odd mix of worry and hate, "Darlena, do you know what this means? It means, we're getting the shit end of the stick! We cant run ourselves, especially not after those gangs and insurgents wrecked half of the fucking state!" Darlena thought for a moment, before saying, "Ryan, it doesn't matter what you think of this, we can't do anything about this, and so we're going to have to live with it now. Our son cant take another night of us arguing, if you can't do it for me, do it for him." Ryan's face went from one of frustration to one of slight sadness, before laying back down on the couch, not wanting to argue with his wife further."
 cd_cal.3.a: "Their household wouldn't be the same after that night, and neither would California."
 cd_cal.4.t: "The Debate"
 cd_cal.4.d: "It's a calm yet busy day, troops patrolling the Senate building, with the Senators already in the building to discuss a new constitutional article. Despite the initial civil war having ended, the government kept an environment of heightened security in order to prevent any remaining partisans from causing issues. The President Pro Tempore calls out, "The chair will look favorably on one speech in favor and opposing this new amendment." The senate hall grows quiet, with the only sound spared being of paper rustling, until senator Markwell of the California National Party walks up to the podium. "Our wildlife, our forests, have already been consumed by the fires of war! We saw the ruined natural beauty of our state, which has killed thousands of wild animals living in our state. It is only fair we protect our forests whenever we can, to ensure our Californian forests, rivers, and lakes stay the same, and so we must grant the legal status of personhood to our natural ecosystems!" The left side of the senate hall breaks into short-lived applause, before quieting down again. \n\n The President Pro Tempore then states, "The chair will now look favorably upon a speech against this." Senator Mirau of Yes California walks up to the podium, staring senator Markwell down. He clears his throat, and says, "Senator Markwell, your argument is quite frankly ridiculous. Members of the senate, let it be known that this senator has gone up to the podium, and has declared to you that trees should be people!" A few senators laughed. "We need to focus on rebuilding our industrial and civillian economy, not on protecting some trees out god knows where! We cannot let our reconstruction be distracted by these people, who want us to make trees be people!" The right side of the Senate erupts into applause. Senator Markwell thinks to himself, before calling out, "President Pro Tempore, I would like the right of response, please." "Granted" the President Pro-Tempore says, and nods in the direction of Markwell. \n\n "People of the senate, rebuilding our states natural beauty is part of the reconstruction process. As ridiculous as it may sound, granting legal personhood to ecosystems is the only way we can ensure our environment can be rebuilt, along with the rest of our state! I also find it very telling that Senator Mirau finds legal personhood for ecosystems ridiculous, but he has no issue with legal personhood for corporations, which is already in Californian state law!" Both sides of the senate erupt into applause for Senator Markwell's rebuttal, the left half of the senate even standing up to applaud him. Senator Mirau sheepishly sat back down into his seat, trying to hide among the cheering senators."
 cd_cal.4.a: "We must stay united, even if just until we gain our independence."
 cd_cal.5.t: "State Militia Revolt!"
