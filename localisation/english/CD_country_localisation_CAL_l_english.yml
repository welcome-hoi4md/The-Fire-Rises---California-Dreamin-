l_english:
 #Focuses
 focus_stay_calm:0 "EVERYONE STAY CALM!"
 focus_stay_calm_desc:0 "The fall of America was predictable, but that doesnt mean we are prepared. troops loyal to the state have managed to secure most of southern california, with the rest falling to communists or local gangs. this has taken a toll on our citizens, who fear for the destruction of their houses and cities. we need to calm our population and guarantee control over our lands."
 focus_recruit_mils:0 "Negotiate With The Militias"
 focus_recruit_mils_desc:0 "While our government would not prefer to work with independent militias, times are different, and we must make some moral sacrifices to keep our state alive. Just like the Weimar Government fighting the Spartacus League of old Germany, we will have to negotiate with militias that agree with our understanding that the Communists are the greatest threat to the state of California, even if it means temporarily working with pro-Trump organizations."
 focus_emergency_govt:0 "Form an Emergency Government"
 focus_emergency_govt_desc:0 "With the rise of extremist governments all over the country, and especially the leftist factions in California, the Democrats find themselves in an uneasy position, which can only be aleviated by forming an alliance with the republicans. Unlike the federal governments, both sides respect democracy and a peaceful transfer of power. A shared republican-democrat coalition would greatly improve stability and almost guarantee all laws get passed through the state senate"
 focus_start_offensive:0 "Quell The Inferno"
 focus_start_offensive_desc:0 "All attempts at peace or negotiations have failed, and the fate of California will be settled on the battlefield. Going forward, the only thing we can ensure is that California will endure. We will not allow gangs, looters, and rioters to take over our beautiful state, and we will certainly not allow the freedoms that have been given to us to be snatched away by some so-called liberators. We will fight for every city, every road, and every inch of land they try to take from us."
