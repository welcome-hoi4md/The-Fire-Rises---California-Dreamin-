 CAL_focus_secessionists_left: "Deals with The Secessionists"
 CAL_focus_secessionists_left_desc: "On the flag of california , two words are spelled clearly under the iconic bear: “california republic” it is the core ideal of our state, or potentially our nation, to ensure that our people live in a land of freedom and democracy. a growing group of people in our land believe that washington is unable to uphold those values and that california deserves to be more then a state.  While seccession from the country is a big ask, we can certainly promise to push for greater autonomy and in exchange gain a lot of new allies."
 CAL_focus_secessionists_right: "Talks with Yes California"
 CAL_focus_secessionists_right_desc: "debug"
 CAL_focus_unite_california_secessionists: "Reunify California"
 CAL_focus_unite_california_secessionists_desc: "At long last, the golden state has returned! Communists,gangs, and sometimes ourselves have tried to get in the way, but california allways finds a way. In order to make sure something like this never happens again, california needs to be strong and free. The way to accomplish this is to unify both major californian seccessionist parties, despite ideological differences, and officialy free california."
 CAL_focus_progressive_republic: "A Progressive Republic"
 CAL_focus_progressive_republic_desc: "The left part of our new coalition, the california national party, is not exactly a household name in the state. Created in 2015 with inspiration drawn from the scottish national party, the CNP has barely even ran in local elections, let alone win. We need to raise awareness that nationalism on the left is possible, and that California deverves to be a free and fair nation!"
 CAL_focus_enshrine_environmental_regulations: "Constitutionalize Environmental Protection"
 CAL_focus_enshrine_environmental_regulations_desc: "For a regrettably long time, the tyrannical Americans have plundered our natural and beautiful forests, lakes, rivers, and ecosystems. With our nation to soon gain her independence, we must make sure that what the Americans did to us will be undone. We will dedicate an entire article of the constitution to giving legal personhood to natural ecosystems, and criminalizing extensive pollution or harm to the natural world."
 CAL_focus_progressive_leaders: "Progressives in The Cabinet"
 CAL_focus_progressive_leaders_desc: "debug"
 CAL_focus_CAL_constitutional_convention: "Declare a Constitutional Convention"
 CAL_focus_CAL_constitutional_convention_desc: "If we do want to prepare Californias seccession, we need to rework the state constitution of old. It is obviously outdated due to being made for a region of the united states, which California is no longer, and will never be again. We will call a convention to update our constitution for an independent nation, like the founding fathers did long before us."
 CAL_focus_nationalist_republic: "A Nationalist Republic"
 CAL_focus_nationalist_republic_desc: "Yes california, the right wing of our coalition, has had its fair share of controversies, but despite that, it has continued on to be part of the ruling coalition in California. We must make sure that our soon-to-be nation can defend herself from external threats, by leveraging our ties with Russia, and building a powerful standing army."
 CAL_focus_enforce_national_identity: "Enforce our National Identity"
 CAL_focus_enforce_national_identity_desc: "California is, and forever will be, a nation, separate from the United States. While our coalition wholeheartedly understands this, not everyone within our soon-to-be nation's population feels the same. While we cannot correct the older generations into understanding our cause for California's independence from America, we have the opportunity to educate the youth on our great, free nation of California."
 CAL_focus_nationalist_leaders: "Nationalists in The Cabinet"
 CAL_focus_nationalist_leaders_desc: "debug"
 CAL_focus_declare_independence: "California, For Californians"
 CAL_focus_declare_independence_desc: "We have established the foundations of our new republic, with a strong constitution and a populous eager for independence. Every moment of our time in office has been leading up to this moment, and all of our preparations are complete. For the first time in more than 150 years, California will be an independent nation, free and separate from America. "
