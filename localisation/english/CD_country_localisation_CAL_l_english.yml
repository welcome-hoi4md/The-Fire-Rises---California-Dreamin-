 #News Events
 cd_cal_news.1.t: "California secedes from the United States"
 cd_cal_news.1.d: "Breaking news has come out of the chaos of the Second American Civil War, as California has declared its full secession from the United States, separate from the 'tyranny' of the American governments. \n\n The leader of this movement, [CAL.getleader], broadcasted himself along with members of the ruling [CAL.GetRulingPartyLong] at around 2 PM PST. In this televised address, he called on for both the separation of the 'Californian Nation' from the rest of America. \n\n It has been reported that the ruling Secessionist Coalition has gained control of both houses of the State Legislature and Capitol in Sacramento, and has used it to their advantage, creating a new constitution of their republic. For the second time in history, California stands as an independent republic. Only time will tell whether it will end up like the first republic from more than a century ago or not"
 cd_cal_news.1.a: "Our republic will not fall this time. Not now, not ever."
 cd_cal_news.1.b: "Let's see it last more than three weeks!"
